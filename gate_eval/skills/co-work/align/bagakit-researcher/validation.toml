version = 2

[[suite]]
id = "bagakit-researcher-shared-runner-eval"
owner = "gate_eval/skills/co-work/align/bagakit-researcher"
description = "Run deterministic non-gating eval for researcher evidence, task-bank capability trials, and survey linkage with the shared dev/eval runner."
default = true
proof_mode = "runtime"
protects = ["researcher eval cases for evidence linkage, pre-retrieval survey packets, bounded session/process quality, resource-use diagnostics, metric-probe counterexamples, Auto Research task-bank and Pareto trial records, synthesis quality and citation-parentage signals, wiki/frontdoor behavior, and source-bound artifact discipline"]
oracle = ["shared dev/eval runner executes researcher suite cases and checks structured eval packets from deterministic research workspaces", "skill-owned Auto Research runner validates fixed task-bank splits, hard regressions, and Pareto dispositions"]
exercised_surface = ["gate_eval/skills/co-work/align/bagakit-researcher/suite.ts", "gate_eval/skills/co-work/align/bagakit-researcher/run-autoresearch.py", "gate_eval/skills/co-work/align/bagakit-researcher/cases/autoresearch-task-bank.json", "dev/eval/src/cli.ts eval runner", "researcher CLI topic artifacts and wiki outputs"]
proves = ["bagakit-researcher-shared-runner-eval proves deterministic researcher eval cases execute, record evidence-linkage findings, and run bounded record-vector trial comparisons."]
does_not_prove = ["bagakit-researcher-shared-runner-eval does not prove frontier research quality, semantic metric grading accuracy, inter-rater reliability, stochastic source selection, downstream handoff value, or release-blocking correctness."]
timeout_seconds = 180
validation_class = "quality"
groups = ["skills", "harness", "researcher", "eval", "quality"]

[suite.runner]
kind = "executable"
command = "{node}"
args = [
  "--experimental-strip-types",
  "dev/eval/src/cli.ts",
  "run",
  "--root",
  "{repo_root}",
  "--suite",
  "gate_eval/skills/co-work/align/bagakit-researcher/suite.ts",
]
