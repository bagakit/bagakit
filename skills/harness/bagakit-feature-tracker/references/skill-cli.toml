version = 1
skill = "bagakit-feature-tracker"
cli_id = "bagakit-feature-tracker"
# Discovery inventory only. Argparse and the durable Tracker contract own the
# complete option and lifecycle semantics.
entrypoint = "scripts/feature-tracker.sh"
runner = "shell"
usage = "sh scripts/feature-tracker.sh <command> [args...]"
summary = "Manage feature planning truth, tasks, and closeout lifecycle."
surface_refs = [
  ".bagakit/feature-tracker",
]

[[command]]
name = "initialize-tracker"
summary = "Apply tracker files into a project."

[[command]]
name = "rekey-local-issuer"
summary = "Rotate the local Feature-id issuer namespace and Git-local guard key."

[[command]]
name = "materialize-feature-artifact"
summary = "Write one optional proposal, spec-delta, or verification helper from its canonical template."

[[command]]
name = "create-feature"
summary = "Create a feature with explicit workspace mode."

[[command]]
name = "create-feature-from-planning-entry-handoff"
summary = "Create a feature from a planning-entry handoff."

[[command]]
name = "set-task-plan"
summary = "Materialize or revise one reviewed semantic task plan with an expected revision guard."

[[command]]
name = "repair-reviewed-task-plan"
summary = "Repair one damaged reviewed tasks.json under exact state, tasks, Goal, and receipt SHA-256 guards."

[[command]]
name = "validate-feature-goal"
summary = "Validate candidate or installed goal.md identity, Feature binding, content presence, and portability."

[[command]]
name = "set-feature-goal"
summary = "Install or revise feature-owned goal.md with an expected SHA-256 revision."

[[command]]
name = "assign-feature-workspace"
summary = "Assign one reviewed feature to current_tree or worktree execution."

[[command]]
name = "adopt-feature-worktree"
summary = "Bind or rebind an existing registered Git worktree and its exact branch to a reviewed feature with no active Tasks."

[[command]]
name = "show-feature-status"
summary = "Show all or one feature as terminal text, JSON, or a read-only HTML review; HTML may be atomically written outside tracker state for human viewing."

[[command]]
name = "serve-feature-status"
summary = "Serve a loopback-only live, read-only status page that regenerates from canonical tracker files on each refresh."

[[command]]
name = "watch-feature-status"
summary = "Render a live, read-only status view in the terminal, recomputed from canonical tracker files on each refresh."

[[command]]
name = "get-owner-receipt"
summary = "Read and verify the persisted execution-owner receipt against canonical feature state."

[[command]]
name = "start-task"
summary = "Atomically start one runnable feature Task after its direct dependencies are done."

[[command]]
name = "unstart-task"
summary = "Return an active task with no gate or prior completion evidence to todo when its receipt is current and its clean execution worktree is at the expected current Git HEAD."

[[command]]
name = "run-task-gate"
summary = "Run the current Task's declared command verification entries in order and record fail-closed evidence."

[[command]]
name = "finish-task"
summary = "Finish one task, requiring canonical class and reason when blocked."

[[command]]
name = "closeout-feature"
summary = "Plan or execute closeout after resolving documentation, learning, and promotion review choices; task-result arguments apply only to archive of an active task."

[[command]]
name = "archive-feature"
summary = "Archive a completed feature with explicit closeout review choices."

[[command]]
name = "discard-feature"
summary = "Discard a feature with lifecycle rationale and explicit closeout review choices."

[[command]]
name = "transfer-feature"
summary = "Transfer unfinished current-plan Tasks to a reviewed successor Feature while preserving their lineage."

[[command]]
name = "validate-tracker"
summary = "Validate tracker consistency."

[[command]]
name = "diagnose-tracker"
summary = "Run tracker diagnostics."

[[command]]
name = "replan-features"
summary = "Replan feature ordering and dependencies."

[[command]]
name = "show-feature-dag"
summary = "Show feature dependency graph."

[[command]]
name = "list-features"
summary = "List tracked features."

[[command]]
name = "get-feature"
summary = "Show one Feature record with its derived active, runnable, blocked, cancelled, transferred, waiting, and done Task frontier."

[[command]]
name = "filter-features"
summary = "Filter tracked features."
