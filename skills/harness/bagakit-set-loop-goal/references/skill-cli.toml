version = 1
skill = "bagakit-set-loop-goal"
cli_id = "bagakit-set-loop-goal"
entrypoint = "scripts/bagakit-set-loop-goal-cli.sh"
runner = "shell"
usage = "sh scripts/bagakit-set-loop-goal-cli.sh <command>"
summary = "Materialize staleness-safe Goal Kernels with one execution owner."
surface_refs = [
  ".bagakit/goal/",
]

[[command]]
name = "describe"
summary = "Print a short skill description."

[[command]]
name = "list-references"
summary = "List reference files shipped by this skill."

[[command]]
name = "validate"
summary = "Check that required skill files exist."

[[command]]
name = "initialize-surface"
summary = "Create the .bagakit/goal runtime surface and its entrypoint files."

[[command]]
name = "inspect-upgrade"
summary = "Inspect protocol, Kernel admission, owner migration, topology, deterministic repairs, and semantic conflicts without mutation."

[[command]]
name = "upgrade-surface"
summary = "Upgrade to v0.3 after legacy dynamic truth is migrated into exactly one execution owner."

[[command]]
name = "upsert-goal"
summary = "Create or update a Goal Kernel with one existing execution owner and sync the registry."

[[command]]
name = "set-foreground"
summary = "Select an incomplete Goal as the foreground execution target."

[[command]]
name = "set-supervision"
summary = "Set supervision mode and materialize the supervisor contract when needed."

[[command]]
name = "relate-goals"
summary = "Add or remove topology edges between Goal files."

[[command]]
name = "request-evolver-review"
summary = "Idempotently request an event-bound Evolver review for a Goal."

[[command]]
name = "record-evolver-review"
summary = "Record the compact outcome of a requested Evolver review."

[[command]]
name = "append-goal-event"
summary = "Append one structured Goal control event to the Goal-owned JSONL stream."

[[command]]
name = "reconcile-goal"
summary = "Confirm owner evidence, record reconciliation, and advance the Goal event cursor without copying live state into Goal."

[[command]]
name = "render-wrapper"
summary = "Emit the fixed Goal invocation wrapper template."

[[command]]
name = "fresh-check"
summary = "Check Kernel shape, owner recovery, registry agreement, event cursor, and archive isolation."

[[command]]
name = "archive-goal"
summary = "Move a completed or abandoned Goal into archive/ and repair the registry."

[[command]]
name = "show-surface"
summary = "Print the current Goal-surface summary."

[[command]]
name = "driver-report"
summary = "Render a read-only Bagakit Goal footer or structured report from current Goal truth and checkpoint evidence."
