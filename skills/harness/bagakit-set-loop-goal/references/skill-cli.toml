version = 1
skill = "bagakit-set-loop-goal"
cli_id = "bagakit-set-loop-goal"
entrypoint = "scripts/bagakit-set-loop-goal-cli.sh"
runner = "shell"
usage = "sh scripts/bagakit-set-loop-goal-cli.sh <command> [args...]"
summary = "Author Feature-owned long-running Agent Goals."
surface_refs = [
  ".bagakit/feature-tracker/features/<feature-id>/goal.md",
]

[[command]]
name = "describe"
summary = "Print the Feature-owned Goal design boundary."

[[command]]
name = "list-references"
summary = "List shipped Goal authoring references."

[[command]]
name = "validate"
summary = "Check required skill assets."

[[command]]
name = "render-template"
summary = "Render a Feature-bound Goal authoring template."

[[command]]
name = "validate-goal"
summary = "Check template completion, then delegate the Goal owner contract to Feature Tracker."

[[command]]
name = "set-goal"
summary = "Delegate revision-guarded goal.md installation to Feature Tracker."

[[command]]
name = "render-wrapper"
summary = "Render the fixed Agent Goal wrapper for one Feature."
