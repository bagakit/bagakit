version = 1
skill = "bagakit-agent-messaging"
cli_id = "bagakit-agent-message-check"
entrypoint = "scripts/agent_message_check.py"
runner = "python"
usage = "python3 scripts/agent_message_check.py --input <message.xml|-> [--json|--emit] | --compose --type <profile> --name <sender> [--time <iso8601>] [--cite-from <src> --cite-text <text> [--cite-ref <ref>]]... --body <line>..."
summary = "Validate one visible Bagakit Agent-message envelope, emit its exact input only after a successful check, or compose an escaped envelope that is emitted only when it validates."
surface_refs = ["<caller-chosen-message.xml>"]
