interface:
  display_name: "Mastery Learning"
  short_description: "Build evidence-backed interactive learning"
  default_prompt: "Use $bagakit-mastery-learning. Author the mastery packet and audit every evidence task for capability alignment, answerability, decision relevance, and fair prompt-defect attribution. Then review learner-facing copy through $bagakit-writing-core and its de-AI-tone route without changing diagnostic, rubric, or evidence meaning. Interactive-course or learning-interface intent defaults to a built page through $bagakit-hitl-webutil-design and $bagakit-codex-webpage-design; keep adaptive feedback and next tasks page-first and verify an adaptive round trip on desktop and mobile. Treat an existing course id, attempt packet, page-submission receipt, or resume request as continuation: evaluate it, update evidence, and project feedback plus the next task back to the original page before using chat as notification. Apply references/first-course-turn.md to the initial state; downgrade only when the user explicitly requests dialogue-only, design-only, or no-file delivery."
