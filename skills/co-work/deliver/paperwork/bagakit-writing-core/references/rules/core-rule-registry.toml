version = 1

[[rule]]
id = "foundation-object-boundary"
source = "bagakit-core"
scope = ["foundation", "route"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "foundation_review"
owner = "bagakit-writing-core"
applies_when = ["drafting", "rewrite", "research_synthesis"]
exempt_when = ["raw_notes"]
good_example = "The artifact names the object, boundary, and first reader question before drafting."
bad_example = "The draft starts from a broad topic label and relies on later sections to define the object."
non_goal = "Do not infer private or personal style from missing foundation fields."

[[rule]]
id = "title-promise-topic-label"
source = "bagakit-core"
scope = ["title", "opening"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "review_packet"
owner = "bagakit-writing-core"
applies_when = ["longform", "technical_article", "decision_memo"]
exempt_when = ["scratch_outline", "raw_notes"]
good_example = "The title makes a claim, boundary, decision, or reader problem visible."
bad_example = "The title only names a topic, project, or implementation surface."
non_goal = "Do not enforce a personal or qihan title style."

[[rule]]
id = "evidence-shape-visible"
source = "bagakit-core"
scope = ["evidence", "foundation"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "foundation_review"
owner = "bagakit-writing-core"
applies_when = ["synthesis", "technical_article", "review_report"]
exempt_when = ["brainstorm_notes"]
good_example = "The draft says whether support comes from examples, commands, sources, data, or user edits."
bad_example = "The draft asserts a conclusion without source shape, sample boundary, or counterevidence."
non_goal = "Do not require external citations for purely local operational notes."

[[rule]]
id = "no-regression-evidence-classes"
source = "bagakit-core"
scope = ["rewrite", "no_regression"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "inventory_compare"
owner = "bagakit-writing-core"
applies_when = ["rewrite", "polish", "compression"]
exempt_when = ["explicit_scope_cut"]
good_example = "The rewrite preserves claims, evidence, constraints, actions, risks, and technical details."
bad_example = "The rewrite reads smoother but drops source links, commands, metrics, or next actions."
non_goal = "Do not block an explicit user-requested deletion when the scope cut is recorded."

[[rule]]
id = "paragraph-movement-list-substitute"
source = "bagakit-core"
scope = ["structure", "paragraph_movement"]
severity = "advisory"
enforcement_tier = "lint"
proof_mode = "lint_json"
owner = "bagakit-writing-core"
applies_when = ["longform", "research_synthesis", "decision_memo"]
exempt_when = ["checklist", "api_reference", "command_guide"]
good_example = "Lists carry inventory while surrounding prose explains causality and reader movement."
bad_example = "Back-to-back lists replace the reasoning that connects claims, evidence, and action."
non_goal = "Do not penalize reference docs for using precise lists."

[[rule]]
id = "audience-first-use"
source = "bagakit-core"
scope = ["audience", "clarity"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "audience_review"
owner = "bagakit-writing-core"
applies_when = ["shared_doc", "public_summary", "handoff"]
exempt_when = ["private_scratch"]
good_example = "The first use of a specialized term includes enough local context for the target reader."
bad_example = "The draft assumes chat, repo, or prior-session context that the target reader cannot see."
non_goal = "Do not expand every familiar domain term into a tutorial."

[[rule]]
id = "review-packet-counterevidence"
source = "bagakit-core"
scope = ["review", "evidence"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "review_packet"
owner = "bagakit-writing-core"
applies_when = ["high_stakes", "longform", "publication_ready"]
exempt_when = ["low_risk_note"]
good_example = "The review packet records counterevidence, accepted deviations, and reviewer ownership."
bad_example = "The review only says the draft is clear without naming residual risk or missing evidence."
non_goal = "Do not turn every small rewrite into a full publication review."

[[rule]]
id = "anti-rationalization-accepted-deviation"
source = "bagakit-core"
scope = ["review", "anti_rationalization"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "review_packet"
owner = "bagakit-writing-core"
applies_when = ["review", "publish", "handoff"]
exempt_when = ["none"]
good_example = "A rule deviation is accepted only with boundary, reason, and next action."
bad_example = "The agent explains away a weak opening, title, evidence gap, or list-heavy section."
non_goal = "Do not remove legitimate variation when the boundary is explicit."

[[rule]]
id = "object-before-short-judgment"
source = "bagakit-core"
scope = ["prose_mechanics", "sentence_rhythm"]
severity = "advisory"
enforcement_tier = "lint"
proof_mode = "lint_json"
owner = "bagakit-writing-core"
applies_when = ["chinese_prose", "rewrite", "longform", "technical_article"]
exempt_when = ["commands", "reference_table", "deliberate_parallelism"]
good_example = "A long or qualified object carries the sentence first, and the short judgment lands at the end."
bad_example = "A short judgment verb opens the sentence, then drags a long object behind it."
non_goal = "Do not overturn claim-first structure or force every Chinese sentence into a `把` construction."

[[rule]]
id = "portfolio-spine-distinctness"
source = "user-feedback"
source_refs = ["references/review/PORTFOLIO_REVIEW.md"]
scope = ["structure", "portfolio"]
severity = "advisory"
enforcement_tier = "review"
proof_mode = "review_packet"
owner = "bagakit-writing-core"
applies_when = ["series", "batch_review", "portfolio"]
exempt_when = ["unrelated_drafts", "format_bound_procedure", "shared_domain_order"]
good_example = "Related articles declare distinct promises and functional spines, while justified shared constraints are recorded."
bad_example = "Unrelated articles reuse the same section-function sequence and only change the topic nouns."
non_goal = "Do not require novelty of structure when a procedure, audience, or evidence contract requires the same order."

[[rule]]
id = "emphasis-carries-judgment"
source = "user-feedback"
source_refs = ["references/review/QA_HARD_METRICS.md"]
scope = ["review", "emphasis"]
severity = "advisory"
enforcement_tier = "review"
proof_mode = "review_packet"
owner = "bagakit-writing-core"
applies_when = ["longform", "public_writing", "review"]
exempt_when = ["navigation_label", "technical_name", "quoted_source"]
good_example = "The prose carries its judgment without needing bold to announce that a sentence is important."
bad_example = "Bold markers substitute for a clear claim, boundary, or action in the surrounding prose."
non_goal = "Do not ban emphasis or optimize for a fixed bold count."

[[rule]]
id = "terminology-stability-one-concept"
source = "asd-ste100-issue-9"
source_refs = ["https://www.asd-ste100.org/about_STE.html", "references/writing/PRECISION_AND_READER_BURDEN.md"]
scope = ["terminology", "clarity"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "agent_review"
owner = "bagakit-writing-core"
applies_when = ["technical_description", "procedure", "handoff", "shared_doc"]
exempt_when = ["quoted_source", "defined_alias", "style_comparison"]
good_example = "One concept keeps one stable term, while exact technical names and declared aliases remain unchanged."
bad_example = "The draft cycles through near-synonyms and makes the reader decide whether they name one concept or several."
non_goal = "Do not replace precise domain terms with a small generic vocabulary or claim STE compliance."

[[rule]]
id = "referent-actor-action-visible"
source = "asd-ste100-issue-9"
source_refs = ["https://www.asd-ste100.org/STEsoftware.html", "references/writing/PRECISION_AND_READER_BURDEN.md"]
scope = ["clarity", "agency", "referent"]
severity = "warn"
enforcement_tier = "review"
proof_mode = "agent_review"
owner = "bagakit-writing-core"
applies_when = ["procedure", "technical_description", "status", "handoff"]
exempt_when = ["actor_unknown_and_marked", "deliberate_voice", "quoted_source"]
good_example = "The sentence names the actor and repeats the precise referent when a pronoun or passive form would be ambiguous."
bad_example = "The former, the latter, it, or a passive clause makes responsibility or reference resolution uncertain."
non_goal = "Do not ban passive voice or pronouns when the actor is irrelevant and the referent is unambiguous."

[[rule]]
id = "instruction-primary-action"
source = "asd-ste100-issue-9"
source_refs = ["https://www.asd-ste100.org/about_STE.html", "https://doi.org/10.1177/154193129604000502", "references/writing/PRECISION_AND_READER_BURDEN.md"]
scope = ["procedure", "instruction"]
severity = "review"
enforcement_tier = "review"
proof_mode = "agent_review"
owner = "bagakit-writing-core"
applies_when = ["procedure", "runbook", "execution_appendix", "safety_instruction"]
exempt_when = ["descriptive_prose", "argument", "inseparable_atomic_action"]
good_example = "Each numbered step has one primary action, with its condition and expected signal attached without hiding order."
bad_example = "One step joins several actions, conditions, and outcomes so the reader can execute them in the wrong order."
non_goal = "Do not turn explanatory or argumentative prose into a mechanical sequence of short commands."

[[rule]]
id = "reader-burden-bounds-complexity"
source = "ste-comprehension-evidence"
source_refs = ["https://doi.org/10.1177/154193129604000502", "https://doi.org/10.14288/1.0078187", "references/writing/PRECISION_AND_READER_BURDEN.md"]
scope = ["audience", "clarity", "sentence_complexity"]
severity = "review"
enforcement_tier = "review"
proof_mode = "audience_review"
owner = "bagakit-writing-core"
applies_when = ["mixed_language_audience", "high_consequence", "procedure", "technical_description"]
exempt_when = ["expert_rationale", "literary_prose", "necessary_qualified_claim"]
good_example = "Sentence and paragraph load matches reader proficiency, text mode, and the consequence of misunderstanding."
bad_example = "A universal length target removes qualifiers, or an overloaded sentence forces a high-consequence reader to reconstruct the sequence."
non_goal = "Do not impose one sentence-length threshold across languages, genres, and readers."
