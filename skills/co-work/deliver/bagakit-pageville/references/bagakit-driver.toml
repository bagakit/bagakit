summary_line = "- Pageville: Surface=<.bagakit/pageville>; Adapter=<loopback_v0|host-policy>; Server=<running|stopped|stale>; Pages=<count>; Active=<count>; Port=<shared|none>; Link=<semantic-url|none>; Version=<latest-or-version|none>; Annotations=<count>; Next=<one deterministic next action>"

