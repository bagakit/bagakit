version = 1
skill = "topdown-image2-sprite-pipeline"
cli_id = "topdown-image2-sprite-pipeline"
entrypoint = "scripts/topdown-image2-sprite-pipeline-cli.sh"
runner = "shell"
usage = "sh scripts/topdown-image2-sprite-pipeline-cli.sh <command> [args...]"
summary = "Process, validate, analyze, and hand off image2-derived top-down sprite packages."
surface_refs = []

[[command]]
name = "describe"
summary = "Print a short skill description."

[[command]]
name = "list-files"
summary = "List files shipped by this skill."

[[command]]
name = "validate"
summary = "Check required skill files and report dependency status."

[[command]]
name = "check-dependencies"
summary = "Check runtime dependencies needed by package commands."

[[command]]
name = "process"
summary = "Process source strips into runtime sheets."

[[command]]
name = "validate-source-layout"
summary = "Run pre-processing source grid and cell-completeness validation."

[[command]]
name = "validate-package"
summary = "Run independent package validation."

[[command]]
name = "validate-paper-doll-source-kit"
summary = "Run paper-doll source-kit validation with slot, residue, chroma, provenance, and manual-gate checks."

[[command]]
name = "preflight-structural-control"
summary = "Run an offline readiness preflight for ComfyUI, OpenPose, identity conditioning, model files, guides, and accelerator support."

[[command]]
name = "validate-single-action"
summary = "Run single-row validation with strip equality, component, bbox, heading, and pose-label gates."

[[command]]
name = "analyze-motion"
summary = "Run visual-semantic motion analysis."

[[command]]
name = "check-handoff"
summary = "Check package handoff artifacts after review."
