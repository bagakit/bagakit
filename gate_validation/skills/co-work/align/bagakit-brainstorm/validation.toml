  "skills/co-work/align/bagakit-brainstorm/references/tpl/expert_forum.md",
  "skills/co-work/align/bagakit-brainstorm/references/tpl/finding_and_analyze.md",
  "skills/co-work/align/bagakit-brainstorm/references/tpl/input_and_qa.md",
  "skills/co-work/align/bagakit-brainstorm/references/tpl/outcome_and_handoff.md",
  "skills/co-work/align/bagakit-brainstorm/references/tpl/related_insights.md",
  "skills/co-work/align/bagakit-brainstorm/references/tpl/review_quality.md",
  "skills/co-work/align/bagakit-brainstorm/references/tpl/eval_effect_review.md",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/README.md",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/suite.ts",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/validation.toml",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/cases/serious-moments.json",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/cases/pilot-calibration.md",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/results/.gitignore",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/results/README.md",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/results/runs/.gitkeep",
