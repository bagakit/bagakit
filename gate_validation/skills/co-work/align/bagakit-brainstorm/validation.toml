version = 2

[[suite]]
id = "bagakit-brainstorm-layout"
owner = "skills/co-work/align/bagakit-brainstorm"
description = "Require the canonical runtime layout and keep legacy standalone repo control files out of bagakit-brainstorm."
default = true
proof_mode = "structural"
protects = ["bagakit-brainstorm installable runtime layout and exclusion of legacy standalone repo payload"]
oracle = ["fs runner checks required skill files, templates, eval registration, validation script, and forbidden legacy paths"]
exercised_surface = ["skills/co-work/align/bagakit-brainstorm runtime directory", "gate_eval/skills/co-work/align/bagakit-brainstorm registration", "gate_validation/skills/co-work/align/bagakit-brainstorm registration"]
proves = ["bagakit-brainstorm-layout proves: Require the canonical runtime layout and keep legacy standalone repo control files out of bagakit-brainstorm."]
does_not_prove = ["bagakit-brainstorm-layout does not prove runtime behavior, semantic correctness, or eval quality."]
validation_class = "structure"
groups = ["skills", "harness", "brainstorm", "structure"]

[suite.runner]
kind = "fs"
required_dirs = [
  "skills/co-work/align/bagakit-brainstorm",
  "skills/co-work/align/bagakit-brainstorm/references",
  "skills/co-work/align/bagakit-brainstorm/references/tpl",
  "skills/co-work/align/bagakit-brainstorm/scripts",
  "gate_eval/skills/co-work/align/bagakit-brainstorm",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/cases",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/results",
  "gate_eval/skills/co-work/align/bagakit-brainstorm/results/runs",
  "gate_validation/skills/co-work/align/bagakit-brainstorm",
]
required_files = [
  "skills/co-work/align/bagakit-brainstorm/README.md",
  "skills/co-work/align/bagakit-brainstorm/SKILL.md",
  "skills/co-work/align/bagakit-brainstorm/scripts/bagakit-brainstorm.sh",
  "skills/co-work/align/bagakit-brainstorm/scripts/bagakit-brainstorm.py",
  "skills/co-work/align/bagakit-brainstorm/references/design-notes.md",
  "skills/co-work/align/bagakit-brainstorm/references/adapter-contract.md",
  "skills/co-work/align/bagakit-brainstorm/references/method-playbook.md",
  "skills/co-work/align/bagakit-brainstorm/references/bagakit-driver.toml",
  "skills/co-work/align/bagakit-brainstorm/references/decision-quality-contract.toml",
