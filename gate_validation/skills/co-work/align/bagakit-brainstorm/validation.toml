[[suite]]
id = "bagakit-brainstorm-smoke"
owner = "skills/co-work/align/bagakit-brainstorm"
description = "Run the brainstorm lifecycle across blocked explicit-adapter plus complete local, auto-with-fallback, and explicit-adapter archive routes."
default = true
proof_mode = "runtime"
protects = ["brainstorm public operator lifecycle for init, status, local completion, adapter routing, archive, and standalone-first storage boundaries"]
oracle = ["smoke script creates deterministic brainstorm artifacts, runs CLI routes, checks status/archive outputs, and verifies no shared knowledge surface is auto-created"]
exercised_surface = ["bagakit-brainstorm.py CLI", "brainstorm artifact markdown files", "archive/handoff output directories", "route adapter settings"]
proves = ["bagakit-brainstorm-smoke proves: Run the brainstorm lifecycle across blocked explicit-adapter plus complete local, auto-with-fallback, and explicit-adapter archive routes."]
does_not_prove = ["bagakit-brainstorm-smoke does not prove live service behavior, stochastic agent quality, or unrelated repository surfaces."]
timeout_seconds = 300
validation_class = "smoke"
groups = ["skills", "harness", "brainstorm", "smoke"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/co-work/align/bagakit-brainstorm/check-bagakit-brainstorm.sh"
args = [
  "--root",
  "{repo_root}",
]
