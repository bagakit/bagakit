version = 2

[[suite]]
id = "bagakit-explain-layout"
owner = "skills/co-work/human-improvement/bagakit-explain"
description = "Require the canonical installable layout for bagakit-explain."
default = true
proof_mode = "structural"
protects = ["bagakit-explain installable layout, discovery metadata, frontdoor declaration, CLI declaration, and validation registration"]
oracle = ["filesystem checks require the family index, public skill, UI metadata, frontdoor declaration, CLI declaration, operator, and owner-local validation"]
exercised_surface = ["skills/co-work/human-improvement/bagakit-explain runtime directory", "gate_validation/skills/co-work/human-improvement/bagakit-explain registration"]
proves = ["The explain runtime and discovery surfaces exist as one installable skill directory."]
does_not_prove = ["Layout does not prove explanation depth, visual quality, learner understanding, or stochastic Agent compliance."]
validation_class = "structure"
groups = ["skills", "human-improvement", "explain", "structure"]

[suite.runner]
kind = "fs"
required_dirs = [
  "skills/co-work/human-improvement",
  "skills/co-work/human-improvement/bagakit-explain",
  "skills/co-work/human-improvement/bagakit-explain/agents",
  "skills/co-work/human-improvement/bagakit-explain/references",
  "skills/co-work/human-improvement/bagakit-explain/scripts",
  "gate_validation/skills/co-work/human-improvement",
  "gate_validation/skills/co-work/human-improvement/bagakit-explain",
]
required_files = [
  "skills/co-work/human-improvement/README.md",
  "skills/co-work/human-improvement/bagakit-explain/SKILL.md",
  "skills/co-work/human-improvement/bagakit-explain/agents/openai.yaml",
  "skills/co-work/human-improvement/bagakit-explain/references/frontdoor-rule.toml",
  "skills/co-work/human-improvement/bagakit-explain/references/skill-cli.toml",
  "skills/co-work/human-improvement/bagakit-explain/references/technical-architecture-analysis.md",
  "skills/co-work/human-improvement/bagakit-explain/scripts/bagakit-explain-cli.sh",
  "gate_validation/skills/co-work/human-improvement/README.md",
  "gate_validation/skills/co-work/human-improvement/bagakit-explain/validation.toml",
]
forbidden_paths = [
  "skills/co-work/human-improvement/bagakit-explain/SKILL_PAYLOAD.json",
  "skills/co-work/human-improvement/bagakit-explain/README.md",
  "skills/co-work/human-improvement/bagakit-explain/assets",
  "skills/co-work/human-improvement/bagakit-explain/docs",
]
