version = 2

[[suite]]
id = "bagakit-project-chronicle-layout"
owner = "skills/co-work/human-improvement/bagakit-project-chronicle"
description = "Require the canonical installable runtime layout, stable and quality contracts, frontdoor declaration, owner-local validation, and non-gating eval registration."
default = true
proof_mode = "structural"
protects = ["bagakit-project-chronicle installable payload, runtime and quality contracts, source adapter guidance, editorial method, validation registration, and owner-local eval slice"]
oracle = ["fs runner checks required skill, operator, reference, template, shared spec, validation, and eval files while forbidding compatibility payloads"]
exercised_surface = ["skills/co-work/human-improvement/bagakit-project-chronicle runtime directory", "docs/specs/project-chronicle-contract.md", "gate_validation/skills/co-work/human-improvement/bagakit-project-chronicle registration", "gate_eval/skills/co-work/human-improvement/bagakit-project-chronicle registration"]
proves = ["bagakit-project-chronicle-layout proves the runtime-ready skill boundary, public contracts, deterministic validation, and non-gating measurement surface are present."]
does_not_prove = ["bagakit-project-chronicle-layout does not prove operator behavior, session-discovery completeness, or literary quality."]
validation_class = "structure"
groups = ["skills", "harness", "project-chronicle", "structure"]

