[[suite]]
id = "bagakit-project-chronicle-cli-smoke"
owner = "skills/co-work/human-improvement/bagakit-project-chronicle"
description = "Exercise census initialization, source registration, honest partial coverage, structured status, draft validation, final closure, and a cast-coverage failure."
default = true
proof_mode = "runtime"
protects = ["project chronicle census and final artifact closure across source cards, lineage, cast, evolution ledger, chronicle, and review"]
oracle = ["smoke script runs the public CLI in a temporary project and checks successful plus fail-closed paths"]
exercised_surface = ["project_chronicle.ts CLI", ".bagakit/project-chronicle/surface.toml", "project chronicle run artifacts"]
proves = ["bagakit-project-chronicle-cli-smoke proves the operator records bounded session coverage and rejects a final chronicle until structured evidence, lineage, cast coverage, reusable principles, prose closure, and review gates are complete."]
does_not_prove = ["bagakit-project-chronicle-cli-smoke does not prove that an external host exposed every session, that cross-session causal judgments are correct, or that the prose has epic quality."]
timeout_seconds = 120
validation_class = "smoke"
groups = ["skills", "harness", "project-chronicle", "smoke"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/co-work/human-improvement/bagakit-project-chronicle/check-project-chronicle.sh"
args = [
  "--root",
  "{repo_root}",
]
