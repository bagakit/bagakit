[[suite]]
id = "bagakit-hitl-webutil-design-contract"
owner = "skills/co-work/deliver/design/bagakit-hitl-webutil-design"
description = "Require the structured HITL web utility design workflow contract."
default = true
proof_mode = "structural"
protects = ["HITL webutil design stage, artifact, eval, shared-guard, crosswalk, component, template, optional Explain foundation, default built-page delivery, explicit downgrade, and peer-boundary contract"]
oracle = ["parsed workflow-contract.toml plus crosswalk foundation mappings, copy-result component, manual-test template, and SKILL.md anchor checks"]
exercised_surface = ["skills/co-work/deliver/design/bagakit-hitl-webutil-design/references/workflow-contract.toml", "composition-crosswalk.md", "references/artifacts/case-catalog.md", "references/artifacts/page-manifest.md", "references/components/contextual-question-capture.md", "references/components/case-directory-panel.md", "references/components/copy-result-control.md", "references/templates/interactive-learning-course.md", "references/templates/evidence-review-console.md", "references/templates/manual-test-console.md", "skills/co-work/human-improvement/bagakit-explain/SKILL.md", "SKILL.md"]
proves = ["bagakit-hitl-webutil-design-contract proves that declared stages, artifacts, structured case/run and continuation fields, components, templates, explanation foundation mappings, delivery policy, and composition boundaries are internally aligned."]
does_not_prove = ["bagakit-hitl-webutil-design-contract does not prove final page usability, adaptive round-trip behavior, frontend implementation quality, or stochastic Agent compliance."]
timeout_seconds = 120
validation_class = "contract"
groups = ["skills", "design", "hitl-webutil-design", "contract"]

[suite.runner]
