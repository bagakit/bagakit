version = 2

[[suite]]
id = "bagakit-pageville-layout"
owner = "skills/co-work/deliver/bagakit-pageville"
description = "Require the canonical installable layout for the shared page host skill."
default = true
proof_mode = "structural"
protects = ["bagakit-pageville installable skill layout, runtime CLI, and contract references"]
oracle = ["fs runner checks the skill entrypoint, agents metadata, CLI references, and scripts"]
exercised_surface = ["skills/co-work/deliver/bagakit-pageville runtime directory"]
proves = ["bagakit-pageville-layout proves the shared pageville skill source is complete and installable."]
does_not_prove = ["bagakit-pageville-layout does not prove server lifecycle, HTTP isolation, or page version behavior."]
validation_class = "structure"
groups = ["skills", "harness", "pageville", "structure"]

[suite.runner]
kind = "fs"
required_dirs = [
  "skills/co-work/deliver/bagakit-pageville",
  "skills/co-work/deliver/bagakit-pageville/agents",
  "skills/co-work/deliver/bagakit-pageville/references",
  "skills/co-work/deliver/bagakit-pageville/scripts",
  "gate_validation/skills/co-work/deliver/bagakit-pageville",
]
required_files = [
  "skills/co-work/deliver/bagakit-pageville/SKILL.md",
  "skills/co-work/deliver/bagakit-pageville/agents/openai.yaml",
  "skills/co-work/deliver/bagakit-pageville/references/frontdoor-rule.toml",
  "skills/co-work/deliver/bagakit-pageville/references/bagakit-driver.toml",
  "skills/co-work/deliver/bagakit-pageville/references/skill-cli.toml",
  "skills/co-work/deliver/bagakit-pageville/references/pageville-contract.toml",
  "skills/co-work/deliver/bagakit-pageville/scripts/pageville.sh",
  "skills/co-work/deliver/bagakit-pageville/scripts/pageville.py",
  "gate_validation/skills/co-work/deliver/bagakit-pageville/validation.toml",
  "gate_validation/skills/co-work/deliver/bagakit-pageville/check-pageville-contract.py",
  "gate_validation/skills/co-work/deliver/bagakit-pageville/check-pageville.sh",
]
forbidden_paths = [
  "skills/co-work/deliver/bagakit-pageville/SKILL_PAYLOAD.json",
  "skills/co-work/deliver/bagakit-pageville/AGENTS.md",
  "skills/co-work/deliver/bagakit-pageville/Makefile",
  "skills/co-work/deliver/bagakit-pageville/docs",
  "skills/co-work/deliver/bagakit-pageville/scripts_dev",
]

[[suite]]
id = "bagakit-pageville-contract"
owner = "skills/co-work/deliver/bagakit-pageville"
description = "Validate the page host registry, semantic link, lifecycle, and annotation contract."
default = true
proof_mode = "structural"
protects = ["pageville runtime surface ownership, one-host port reuse, immutable versions, retrieval, and append-only annotations"]
oracle = ["contract checker parses pageville-contract.toml and checks the public command and safety vocabulary"]
exercised_surface = ["skills/co-work/deliver/bagakit-pageville/references/pageville-contract.toml", "skills/co-work/deliver/bagakit-pageville/SKILL.md"]
proves = ["bagakit-pageville-contract proves that the declared runtime, registry, hosting, annotation, command, and safety boundaries are aligned."]
does_not_prove = ["bagakit-pageville-contract does not prove that a particular page renders correctly in a browser."]
validation_class = "contract"
groups = ["skills", "harness", "pageville", "contract"]
timeout_seconds = 120

[suite.runner]
kind = "python_script"
script = "gate_validation/skills/co-work/deliver/bagakit-pageville/check-pageville-contract.py"
args = ["--root", "{repo_root}"]

[[suite]]
id = "bagakit-pageville-smoke"
owner = "skills/co-work/deliver/bagakit-pageville"
description = "Exercise page publication, one-host reuse, semantic links, version retention, retrieval, annotation, archive, and shutdown."
default = true
proof_mode = "runtime"
protects = ["shared page host public CLI lifecycle and page/version round trip"]
oracle = ["smoke script runs the CLI in a temporary host, fetches served pages, verifies one reused port, and checks canonical retrieval and annotations"]
exercised_surface = ["pageville CLI", "loopback HTTP routes", "temporary .bagakit/pageville registry"]
proves = ["bagakit-pageville-smoke proves the public pageville lifecycle and one-port semantic page round trip."]
does_not_prove = ["bagakit-pageville-smoke does not prove external network delivery, browser visual quality, or domain-specific page semantics."]
timeout_seconds = 120
validation_class = "smoke"
groups = ["skills", "harness", "pageville", "smoke"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/co-work/deliver/bagakit-pageville/check-pageville.sh"
args = ["--root", "{repo_root}"]
