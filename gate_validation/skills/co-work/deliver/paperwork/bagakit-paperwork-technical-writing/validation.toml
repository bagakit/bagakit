version = 2

[[suite]]
id = "bagakit-paperwork-technical-writing-contract"
owner = "skills/co-work/deliver/paperwork/bagakit-paperwork-technical-writing"
description = "Validate the technical-writing core and de-AI-tone dispatch, concise technical-collaboration distillation route, review packet contract, source-parentage review template, and article checker behavior."
default = true
proof_mode = "runtime"
protects = ["bagakit-paperwork-technical-writing public CLI, core CLI dispatch, de-AI-tone primitive dispatch through core, concise distillation route, review packet contract, and objective article hard gates"]
oracle = ["Python regression check runs skill CLI validation, dispatches the technical-writing CLI to bagakit-writing-core and through core to bagakit-writing-de-ai-tone, prints the distillation workflow/template/guardrails, masks deterministic credential fixtures, prints the review packet template, checks source-parentage report fields, and runs check-article.py on passing and failing synthetic fixtures"]
exercised_surface = ["technical-writing skill CLI", "core dispatch command", "de-AI-tone dispatch through core", "distillation workflow", "refined document template", "distillation guardrails", "mask-secrets.py", "review packet template", "review report template", "check-article.py", "synthetic article fixtures"]
proves = ["bagakit-paperwork-technical-writing-contract proves the skill exposes explicit core and de-AI-tone dispatch when composed, exposes a bounded concise distillation route with source, masking, and gap guardrails, and accepts a structurally valid article while rejecting a placeholder draft under strict mode."]
does_not_prove = ["bagakit-paperwork-technical-writing-contract does not prove subjective publication quality, external source correctness, human voice, all possible article profiles, or behavior when the sibling core is intentionally absent from an installed host."]
timeout_seconds = 120
validation_class = "contract"
groups = ["skills", "co-work", "deliver", "paperwork", "bagakit-paperwork-technical-writing", "contract"]

[suite.runner]
kind = "python_script"
script = "gate_validation/skills/co-work/deliver/paperwork/bagakit-paperwork-technical-writing/check-paperwork-technical-writing.py"
args = []
