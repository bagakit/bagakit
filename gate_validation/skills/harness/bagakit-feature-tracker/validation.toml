version = 2

[[suite]]
id = "bagakit-feature-tracker-layout"
owner = "skills/harness/bagakit-feature-tracker"
description = "Require the canonical runtime layout and keep non-runtime repo artifacts out of bagakit-feature-tracker."
default = true
proof_mode = "structural"
protects = ["bagakit-feature-tracker installable runtime layout and exclusion of non-runtime or legacy adapter payload"]
oracle = ["fs runner checks required skill files, templates, eval registration, validation scripts, shared test library, and forbidden legacy paths"]
exercised_surface = ["skills/harness/bagakit-feature-tracker runtime directory", "gate_eval/skills/harness/bagakit-feature-tracker registration", "gate_validation/skills/harness/bagakit-feature-tracker registration"]
proves = ["bagakit-feature-tracker-layout proves: Require the canonical runtime layout and keep non-runtime repo artifacts out of bagakit-feature-tracker."]
does_not_prove = ["bagakit-feature-tracker-layout does not prove runtime behavior, semantic correctness, or eval quality."]
validation_class = "structure"
groups = ["skills", "harness", "feature-tracker", "structure"]

[suite.runner]
kind = "fs"
required_dirs = [
