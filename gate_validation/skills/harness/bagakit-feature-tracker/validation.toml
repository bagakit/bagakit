[[suite]]
id = "bagakit-feature-tracker-smoke"
owner = "skills/harness/bagakit-feature-tracker"
description = "Run a minimal feature-tracker lifecycle: initialize, create feature, assign workspace, start task, and replan."
default = true
proof_mode = "runtime"
protects = ["feature-tracker public lifecycle for initialization, feature creation, workspace assignment, task start, and replan state"]
oracle = ["smoke script drives feature-tracker CLI commands in a temporary repo and checks resulting tracker state and command outputs"]
exercised_surface = ["feature-tracker CLI", ".bagakit/feature-tracker state files", "gate_validation feature-tracker smoke fixture"]
proves = ["bagakit-feature-tracker-smoke proves: Run a minimal feature-tracker lifecycle: initialize, create feature, assign workspace, start task, and replan."]
does_not_prove = ["bagakit-feature-tracker-smoke does not prove live service behavior, stochastic agent quality, or unrelated repository surfaces."]
timeout_seconds = 300
validation_class = "smoke"
groups = ["skills", "harness", "feature-tracker", "smoke"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker.sh"
args = [
  "--root",
  "{repo_root}",
]

[[suite]]
id = "bagakit-feature-tracker-semantic-task-truth"
owner = "skills/harness/bagakit-feature-tracker"
description = "Require reviewed semantic task plans before workspace execution and expose a current execution-owner receipt."
default = true
proof_mode = "state_machine"
protects = ["feature-tracker reviewed v2 task-plan execution gate, current-plan supersession lineage, portable reference boundary, and content-bound owner receipt freshness"]
oracle = ["public CLI fixture creates a draft proposal, proves assign/start rejection, rejects unsafe references, materializes four reviewed revisions, prevents superseded task restart, and rejects missing or stale receipts plus canonical state bytes written without receipt refresh"]
exercised_surface = ["feature-tracker create-feature, set-task-plan, assign-feature-workspace, start-task, finish-task, get-owner-receipt, and validate-tracker commands", ".bagakit/feature-tracker feature tasks and owner receipt state"]
proves = ["bagakit-feature-tracker-semantic-task-truth proves draft or non-v2 plans cannot execute, reviewed plans preserve current-versus-historical supersession lineage, unsafe refs fail closed, and owner receipts bind canonical state bytes."]
does_not_prove = ["bagakit-feature-tracker-semantic-task-truth does not prove task decomposition quality, specification completeness, Flow Runner execution history, or external Goal adapter behavior."]
timeout_seconds = 300
validation_class = "quality"
groups = ["skills", "harness", "feature-tracker", "quality", "semantic-task-truth"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker-semantic-task-truth.sh"
args = [
  "--root",
  "{repo_root}",
]

[[suite]]
id = "bagakit-feature-tracker-goal-contract"
owner = "skills/harness/bagakit-feature-tracker"
description = "Keep optional long-running Goal control truth inside its Feature owner and bind it into lifecycle receipts."
default = true
proof_mode = "state_machine"
protects = ["feature-owned goal.md placement, Feature identity binding, revision-guarded mutation, receipt freshness, tamper repair, and closeout preservation"]
oracle = ["public CLI fixture validates and installs goal.md, rejects wrong identity and stale revisions, detects manual drift, repairs by recorded revision, and archives the same content-bound Goal with its Feature"]
exercised_surface = ["feature-tracker validate-feature-goal, set-feature-goal, validate-tracker, and archive-feature commands", "feature state.json goal_contract", "owner-receipt evidence hashes", "active and archived feature roots"]
proves = ["bagakit-feature-tracker-goal-contract proves a Feature may own one direct Agent Goal without creating a second lifecycle, topology, event, or archive surface."]
does_not_prove = ["bagakit-feature-tracker-goal-contract does not prove stochastic Goal authoring quality or legacy Goal migration judgment."]
timeout_seconds = 300
validation_class = "quality"
groups = ["skills", "harness", "feature-tracker", "set-loop-goal", "quality"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker-goal-contract.sh"
args = [
  "--root",
  "{repo_root}",
]

