id = "bagakit-feature-tracker-plan-shaping-ssot"
owner = "skills/harness/bagakit-feature-tracker"
description = "SSOT drift detector for structural synchronization between live plan-shaping references, GUIDE links, SKILL routing, and validation suite registrations."
default = true
proof_mode = "structural"
timeout_seconds = 30
protects = ["plan-shaping SSOT synchronization across live child references, GUIDE links, SKILL pointer, and check-suite registrations"]
oracle = ["SSOT drift check derives child, link, and runner.script sets from live surfaces and fails closed when they diverge"]
exercised_surface = ["skills/harness/bagakit-feature-tracker/references/plan-shaping directory and GUIDE.md", "skills/harness/bagakit-feature-tracker/SKILL.md", "gate_validation/skills/harness/bagakit-feature-tracker/validation.toml and check scripts"]
proves = ["bagakit-feature-tracker-plan-shaping-ssot proves every live markdown child is linked by GUIDE.md and exists, the SKILL.md pointer is singular, and plan-shaping check scripts and validation registrations remain synchronized."]
does_not_prove = ["bagakit-feature-tracker-plan-shaping-ssot passing does not prove the guidance content is semantically consistent; it proves only that the surfaces are structurally synchronized."]
validation_class = "contract"
groups = ["skills", "harness", "feature-tracker", "plan-shaping", "ssot", "contract"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker-plan-shaping-ssot.sh"
args = [
  "--root",
  "{repo_root}",
]

[[suite]]
id = "bagakit-feature-tracker-status-board"
owner = "skills/harness/bagakit-feature-tracker"
description = "Keep the human status board spatially stable and make focused Feature, title-copy, compact Task, and topology interactions readable."
default = true
proof_mode = "runtime"
timeout_seconds = 60
protects = ["Feature Tracker status-board layout stability, tracker-id focus, title copying, compact Task summaries, and routed topology edges"]
oracle = ["status-board check renders all canonical status columns including empty states, focused markup, copy affordances, compact title hooks, independently routed topology lanes, and the live focus refresh hook"]
exercised_surface = ["feature-tracker show-feature-status HTML projection", "feature-tracker serve-feature-status HTML projection", "status-board regression fixture"]
proves = ["bagakit-feature-tracker-status-board proves the requested status-board presentation and interaction hooks remain present on the canonical projection fixture."]
does_not_prove = ["bagakit-feature-tracker-status-board does not prove browser clipboard permissions, subjective visual taste, or arbitrary user-created graph readability beyond the deterministic fixture."]
validation_class = "quality"
groups = ["skills", "harness", "feature-tracker", "status-board", "quality"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker-status-board.sh"
args = [
  "--root",
  "{repo_root}",
]
