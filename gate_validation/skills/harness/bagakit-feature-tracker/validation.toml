[[suite]]
id = "bagakit-feature-tracker-smoke"
owner = "skills/harness/bagakit-feature-tracker"
description = "Run the canonical lifecycle and fail closed when gate commands or verification evidence are missing or invalid."
default = true
proof_mode = "runtime"
protects = ["feature-tracker public lifecycle for initialization, feature creation, workspace assignment, task start, and replan state"]
oracle = ["smoke script drives feature-tracker CLI commands in a temporary repo, checks canonical state, and proves command success cannot override missing verification evidence or invalid gate configuration"]
exercised_surface = ["feature-tracker CLI", ".bagakit/feature-tracker state files", "gate_validation feature-tracker smoke fixture"]
proves = ["bagakit-feature-tracker-smoke proves the canonical lifecycle and gate aggregate reject empty or malformed command sets and required-verification failures."]
does_not_prove = ["bagakit-feature-tracker-smoke does not prove live service behavior, stochastic agent quality, or unrelated repository surfaces."]
timeout_seconds = 300
validation_class = "smoke"
groups = ["skills", "harness", "feature-tracker", "smoke"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker.sh"
args = [
  "--root",
  "{repo_root}",
]

[[suite]]
id = "bagakit-feature-tracker-closeout-review"
owner = "skills/harness/bagakit-feature-tracker"
description = "Require explicit documentation, execution-learning, and principle-conformant promotion choices before Feature closeout."
default = true
proof_mode = "state_machine"
protects = ["feature-tracker closeout review completeness, option consistency, atomic publication, summary projection, and existing receipt binding"]
oracle = ["public CLI fixture rejects missing or contradictory review choices without mutating active control truth, closes archive and discard with valid choices, and inspects final tasks, summary, and receipt hashes"]
exercised_surface = ["feature-tracker closeout-feature, archive-feature, discard-feature, and validate-tracker commands", "final tasks.json closeout_review, summary.md, and owner-receipt.json"]
proves = ["bagakit-feature-tracker-closeout-review proves all public closeout paths require three resolved review items, publish one canonical review atomically, project it into the summary, and bind it through the existing receipt."]
does_not_prove = ["bagakit-feature-tracker-closeout-review does not prove that a rationale is insightful, that a document is semantically complete, or that a promoted lesson generalizes beyond its evidence."]
timeout_seconds = 300
validation_class = "quality"
groups = ["skills", "harness", "feature-tracker", "quality", "closeout"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker-closeout-review.sh"
args = [
  "--root",
  "{repo_root}",
]

[[suite]]
id = "bagakit-feature-tracker-semantic-task-truth"
owner = "skills/harness/bagakit-feature-tracker"
description = "Require reviewed semantic task plans before workspace execution and expose a current execution-owner receipt."
default = true
proof_mode = "state_machine"
protects = ["feature-tracker reviewed v2 task-plan execution gate, canonical blocker lifecycle, owner-bound current versus historical supersession lineage, evidence-safe task unstart, portable reference boundary, and content-bound owner receipt freshness"]
oracle = ["public CLI fixture creates a draft proposal, proves assign/start rejection, rejects unsafe references and invalid blocker transitions without control-file writes, preserves exact task-level blocker evidence across restart and plan revision, prevents retired id reuse and supersession owner drift, rejects unsafe unstart attempts, and rejects missing or stale receipts"]
exercised_surface = ["feature-tracker create-feature, set-task-plan, assign-feature-workspace, start-task, unstart-task, finish-task, get-owner-receipt, and validate-tracker commands", ".bagakit/feature-tracker feature tasks and owner receipt state"]
proves = ["bagakit-feature-tracker-semantic-task-truth proves draft or non-v2 plans cannot execute, blocked finish requires exact class and reason with attributable task evidence, restart and reviewed replan clear only the live blocker, reviewed plans preserve newly removed versus owner-bound historical supersession lineage, only evidence-free active tasks can be safely unstarted, unsafe refs fail closed, and owner receipts bind canonical state bytes."]
does_not_prove = ["bagakit-feature-tracker-semantic-task-truth does not prove task decomposition quality, specification completeness, Flow Runner execution history, or external Goal adapter behavior."]
timeout_seconds = 300
validation_class = "quality"
groups = ["skills", "harness", "feature-tracker", "quality", "semantic-task-truth"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-feature-tracker/check-feature-tracker-semantic-task-truth.sh"
args = [
  "--root",
  "{repo_root}",
]

[[suite]]
id = "bagakit-feature-tracker-goal-contract"
owner = "skills/harness/bagakit-feature-tracker"
description = "Keep optional long-running Goal control truth inside its Feature owner and bind it into lifecycle receipts."
default = true
proof_mode = "state_machine"
