version = 2

[[suite]]
id = "bagakit-set-loop-goal-layout"
owner = "skills/harness/bagakit-set-loop-goal"
description = "Require the concise Feature-owned Goal authoring skill layout."
default = true
proof_mode = "structural"
protects = ["bagakit-set-loop-goal installable authoring layout without an independent runtime, Driver, event stream, or supervisor payload"]
oracle = ["fs runner requires the authoring entrypoint, two focused references, metadata, and owner-local gates while forbidding retired runtime and migration references"]
exercised_surface = ["skills/harness/bagakit-set-loop-goal runtime directory", "gate_validation/skills/harness/bagakit-set-loop-goal registration"]
proves = ["bagakit-set-loop-goal-layout proves the shipped skill contains only Feature-owned Goal authoring assets."]
does_not_prove = ["bagakit-set-loop-goal-layout does not prove runtime behavior or stochastic Goal quality."]
validation_class = "structure"
groups = ["skills", "harness", "set-loop-goal", "structure"]

[suite.runner]
kind = "fs"
required_dirs = [
  "skills/harness/bagakit-set-loop-goal",
  "skills/harness/bagakit-set-loop-goal/agents",
  "skills/harness/bagakit-set-loop-goal/references",
  "skills/harness/bagakit-set-loop-goal/scripts",
  "gate_validation/skills/harness/bagakit-set-loop-goal",
]
required_files = [
  "skills/harness/bagakit-set-loop-goal/SKILL.md",
  "skills/harness/bagakit-set-loop-goal/agents/openai.yaml",
  "skills/harness/bagakit-set-loop-goal/references/skill-cli.toml",
  "skills/harness/bagakit-set-loop-goal/references/frontdoor-rule.toml",
  "skills/harness/bagakit-set-loop-goal/references/goal-file-contract.md",
  "skills/harness/bagakit-set-loop-goal/references/goal-template.md",
  "skills/harness/bagakit-set-loop-goal/scripts/bagakit-set-loop-goal-cli.sh",
  "skills/harness/bagakit-set-loop-goal/scripts/bagakit-set-loop-goal.py",
  "gate_validation/skills/harness/bagakit-set-loop-goal/validation.toml",
  "gate_validation/skills/harness/bagakit-set-loop-goal/check-set-loop-goal-contract.py",
  "gate_validation/skills/harness/bagakit-set-loop-goal/check-set-loop-goal.sh",
]
forbidden_paths = [
  "skills/harness/bagakit-set-loop-goal/SKILL_PAYLOAD.json",
  "skills/harness/bagakit-set-loop-goal/README.md",
  "skills/harness/bagakit-set-loop-goal/docs",
  "skills/harness/bagakit-set-loop-goal/gate",
  "skills/harness/bagakit-set-loop-goal/scripts_dev",
  "skills/harness/bagakit-set-loop-goal/references/bagakit-driver.toml",
  "skills/harness/bagakit-set-loop-goal/references/event-stream-contract.md",
  "skills/harness/bagakit-set-loop-goal/references/loop-off-loop.md",
  "skills/harness/bagakit-set-loop-goal/references/tool-orchestration.md",
  "skills/harness/bagakit-set-loop-goal/references/protocol-upgrade-contract.md",
  "skills/harness/bagakit-set-loop-goal/references/design-origin.md",
]

[[suite]]
id = "bagakit-set-loop-goal-contract"
owner = "skills/harness/bagakit-set-loop-goal"
description = "Keep the exact Goal wrapper and structured Feature-owned CLI/frontdoor declarations aligned."
default = true
proof_mode = "wording_contract"
protects = ["fixed exact-Feature Agent wrapper, structured Feature-owned surface declarations, public command inventory, and concise SKILL.md size"]
oracle = ["contract checker parses TOML declarations, compares the published wrapper exactly, and checks only public metadata plus the explicit Skill size budget"]
exercised_surface = ["set-loop-goal SKILL.md size", "goal-file-contract.md Agent wrapper", "frontdoor-rule.toml", "Goal and Feature Tracker CLI metadata"]
proves = ["bagakit-set-loop-goal-contract proves the published wrapper and structured Goal ownership entrypoints stay aligned."]
does_not_prove = ["bagakit-set-loop-goal-contract does not prove runtime behavior, Kernel quality, or absence of arbitrary text elsewhere; runtime suites own those claims."]
timeout_seconds = 120
validation_class = "contract"
groups = ["skills", "harness", "set-loop-goal", "feature-tracker", "contract"]

[suite.runner]
kind = "python_script"
script = "gate_validation/skills/harness/bagakit-set-loop-goal/check-set-loop-goal-contract.py"
args = ["--root", "{repo_root}"]

[[suite]]
id = "bagakit-set-loop-goal-smoke"
owner = "skills/harness/bagakit-set-loop-goal"
description = "Author and revision-guard independent Feature Goals through the public Goal and Feature Tracker CLIs."
default = true
proof_mode = "runtime"
protects = ["Goal template rejection until resolved, delegated validation and mutation, two concurrent Feature roots, fixed wrapper, receipt-backed state, and no .bagakit/goal runtime"]
oracle = ["temporary-repo fixture creates two Features, installs separate Goal files, validates tracker truth, checks exact wrapper text, and proves stale revisions fail"]
exercised_surface = ["bagakit-set-loop-goal render-template, validate-goal, set-goal, render-wrapper commands", "Feature Tracker public owner surface"]
proves = ["bagakit-set-loop-goal-smoke proves multiple Feature Goals coexist without a global foreground and all writes remain Feature Tracker-owned."]
does_not_prove = ["bagakit-set-loop-goal-smoke does not prove stochastic Goal authoring quality."]
timeout_seconds = 300
validation_class = "smoke"
groups = ["skills", "harness", "set-loop-goal", "feature-tracker", "smoke"]

[suite.runner]
kind = "bash_script"
script = "gate_validation/skills/harness/bagakit-set-loop-goal/check-set-loop-goal.sh"
args = ["--root", "{repo_root}"]
